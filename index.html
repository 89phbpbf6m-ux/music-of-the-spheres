<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music of the Spheres</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f4;--fg:#1d1b2e;--mut:#6b6880;--card:#fff;--line:#d9d5e4;--acc:#6b4fd8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--fg:#ece9f7;--mut:#9a96b3;--card:#1c1930;--line:#33304d;--acc:#a58bff}}
:root[data-theme="dark"]{--bg:#12101f;--fg:#ece9f7;--mut:#9a96b3;--card:#1c1930;--line:#33304d;--acc:#a58bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px;max-width:520px;margin:0 auto}
h1{font:600 20px Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=number]{width:74px}
input[type=datetime-local]{flex:1;min-width:0}
svg{width:100%;height:auto;display:block}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow-x:auto}
.p{display:grid;grid-template-columns:26px 24px 1fr auto;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.p:last-child{border:0}
.p small{color:var(--mut);display:block}
.p .n{text-align:right;font-variant-numeric:tabular-nums}
.g{font-size:18px}
[hidden]{display:none!important}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.opt label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.opt select{width:100%}
.dtg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}
.dtg label{font-size:11px;color:var(--mut);display:block;text-align:center}
.dtg input{width:100%;text-align:center;padding:7px 2px}
.dtg .b{display:flex;gap:4px;margin-top:4px}
.dtg .b button{flex:1;padding:6px 0}
</style></head><body>
<h1>Music of the Spheres</h1>
<div class="sub">Each sign is a note; each planet has its own octave and voice. Sign order and microtones are in Options.</div>
<div class="row"><button id="snd">🔇 Sound off</button><button id="play">▶ Play</button><button id="rev">⇄ Forward</button><button id="optb">⚙ Options</button></div>
<div class="row"><select id="spd"><option value="60">1 min / sec</option><option value="600">10 min / sec</option><option value="3600" selected>1 hour / sec</option><option value="21600">6 hours / sec</option><option value="86400">1 day / sec</option><option value="604800">1 week / sec</option></select><button id="now">Now</button><span id="st" style="color:var(--mut);font-size:12px"></span></div>
<div class="opt" id="opt" hidden>
<label>Sign order</label><select id="ord"><option value="5" selected>Circle of fourths (C → F → B♭ …)</option><option value="1">Sequential semitones</option><option value="7">Circle of fifths (C → G → D …)</option></select>
<label>Microtones</label><select id="mic"><option value="0" selected>Off (sign note only)</option><option value="1">Decans (⅓-semitone steps)</option><option value="2">Smooth (continuous)</option></select>
<label>Chart location (for Ascendant / Midheaven)</label>
<div class="row"><span style="color:var(--mut);font-size:13px">Lat</span><input type="number" id="lat" value="40.71" step="0.1"><span style="color:var(--mut);font-size:13px">Lon</span><input type="number" id="lon" value="-74.0" step="0.1"></div>
<label>Sign → note</label><div id="map" style="font-size:13px;display:flex;gap:8px;flex-wrap:wrap"></div>
</div>
<div class="dtg" id="dtg"></div>
<svg id="wheel" viewBox="0 0 340 340"></svg>
<div class="list" id="list"></div>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
const SIGNS="♈♉♊♋♌♍♎♏♐♑♒♓".split("");
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
// oct: octaves relative to middle C; vol: relative volume
const B=[
{id:"Sun",g:"☉",inst:"French horn",oct:0,vol:1,w:"sawtooth",lp:700,q:1,vib:0,col:"#e0a100"},
{id:"Mercury",g:"☿",inst:"Clarinet",oct:1,vol:1,w:"square",lp:1800,q:0.7,vib:3,col:"#7a8cff"},
{id:"Venus",g:"♀",inst:"Oboe",oct:0,vol:1,w:"sawtooth",lp:2600,q:3,vib:6,col:"#e0609a"},
{id:"Moon",g:"☽",inst:"Glass harp",oct:1,vol:1,w:"sine",lp:6000,q:0.5,vib:4,col:"#9aa6c0"},
{id:"Mars",g:"♂",inst:"Trumpet",oct:0,vol:1,w:"sawtooth",lp:3000,q:3,vib:0,col:"#e5483a"},
{id:"Jupiter",g:"♃",inst:"Trombone",oct:-1,vol:1,w:"sawtooth",lp:900,q:1,vib:0,col:"#c97b2a"},
{id:"Saturn",g:"♄",inst:"Cello",oct:-1,vol:1,w:"sawtooth",lp:1200,q:1,vib:5,col:"#8a7a5a"},
{id:"Uranus",g:"♅",inst:"Bassoon",oct:-1,vol:1,w:"square",lp:800,q:1,vib:0,col:"#2bb5b5"},
{id:"Neptune",g:"♆",inst:"String pad",oct:0,vol:1,w:"sawtooth",lp:1500,q:0.5,vib:3,det:[-9,0,9],col:"#4a7be0"},
{id:"Pluto",g:"♇",inst:"Double bass",oct:-2,vol:1,w:"sawtooth",lp:450,q:1,vib:0,col:"#8c4a8c"},
{id:"Asc",g:"AC",inst:"Flute",oct:1,vol:.5,w:"triangle",lp:4500,q:0.5,vib:5,col:"#3aa86a"},
{id:"MC",g:"MC",inst:"Piccolo",oct:2,vol:.25,w:"triangle",lp:9000,q:0.5,vib:5,col:"#3aa86a"}
];
B.forEach(b=>{b.on=b.pref=["Sun","Moon","Asc","MC"].includes(b.id);b.lon=0;b.v=null});
let t=Date.now(),order=5,micro=0,playing=false,dir=1,ctx=null,master=null,soundOn=false,keep=null;
const $=id=>document.getElementById(id);

function norm(x){return ((x%360)+360)%360}
function lons(date){
  const out={},yrs=(date-Date.UTC(2000,0,1,12))/31557600000,prec=yrs*0.0139694;
  for(const b of B.slice(0,10)){
    const e=Astronomy.Ecliptic(Astronomy.GeoVector(b.id,date,true));
    out[b.id]=norm(e.elon+prec);
  }
  const lat=parseFloat($("lat").value)||0,lg=parseFloat($("lon").value)||0;
  const ram=norm(Astronomy.SiderealTime(date)*15+lg)*Math.PI/180,T=yrs/100;
  const eps=(23.4393-0.0130042*T)*Math.PI/180,ph=lat*Math.PI/180,d=180/Math.PI;
  out.MC=norm(Math.atan2(Math.sin(ram),Math.cos(ram)*Math.cos(eps))*d);
  out.Asc=norm(Math.atan2(Math.cos(ram),-(Math.sin(ram)*Math.cos(eps)+Math.tan(ph)*Math.sin(eps)))*d);
  return out;
}
function freq(b){
  const si=Math.floor(b.lon/30),r=b.lon-si*30;
  const frac=micro==2?r/30:micro==1?Math.floor(r/10)/3:0;
  return 261.6256*Math.pow(2,b.oct+((si*order)%12+frac)/12);
}
function noteName(f){
  const m=69+12*Math.log2(f/440),n=Math.round(m),c=Math.round((m-n)*100);
  return NAMES[((n%12)+12)%12]+(Math.floor(n/12)-1)+(c?` ${c>0?"+":""}${c}¢`:"");
}
function mkVoice(b){
  const g=ctx.createGain();g.gain.value=0;
  const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=b.lp;f.Q.value=b.q;
  f.connect(g);g.connect(master);
  const oscs=[];
  (b.det||[0]).forEach(dc=>{
    const o=ctx.createOscillator();o.type=b.w;o.detune.value=dc;
    const og=ctx.createGain();og.gain.value=1/(b.det?b.det.length:1);
    o.connect(og);og.connect(f);
    if(b.vib){const l=ctx.createOscillator();l.frequency.value=5+Math.random();
      const lg=ctx.createGain();lg.gain.value=b.vib;l.connect(lg);lg.connect(o.detune);l.start()}
    o.start();oscs.push(o);
  });
  return {g,oscs};
}
function audioUpdate(){
  if(!ctx)return;const now=ctx.currentTime;
  for(const b of B){
    if(!b.v)b.v=mkVoice(b);
    const f=freq(b);
    b.v.oscs.forEach(o=>{
      if(b.jump)o.frequency.setValueAtTime(f,now);else o.frequency.setTargetAtTime(f,now,0.08);
    });
    b.jump=false;
    b.v.g.gain.setTargetAtTime(b.on?0.07*b.vol:0,now,0.05);
  }
}
// UI
const list=$("list");
B.forEach(b=>{
  const r=document.createElement("div");r.className="p";
  r.innerHTML=`<input type="checkbox" ${b.on?"checked":""} id="c_${b.id}"><span class="g" style="color:${b.col}">${b.g}</span><span>${b.id==="Asc"?"Ascendant":b.id==="MC"?"Midheaven":b.id}<small>${b.inst} · octave ${b.oct>=0?"+":""}${b.oct}</small></span><span class="n" id="n_${b.id}"></span>`;
  list.appendChild(r);
  r.querySelector("input").onchange=e=>{b.on=b.pref=e.target.checked;audioUpdate()};
});
const svg=$("wheel"),C=170;
function pt(l,r){const a=l*Math.PI/180;return [C-r*Math.cos(a),C+r*Math.sin(a)]}
function draw(){
  let s=`<circle cx="${C}" cy="${C}" r="160" fill="none" stroke="var(--line)"/><circle cx="${C}" cy="${C}" r="128" fill="none" stroke="var(--line)"/>`;
  for(let i=0;i<12;i++){
    const [x1,y1]=pt(i*30,128),[x2,y2]=pt(i*30,160),[tx,ty]=pt(i*30+15,144);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="16" fill="var(--mut)">${SIGNS[i]}</text>`;
  }
  const act=B.filter(b=>b.on);
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const d=Math.abs(act[i].lon-act[j].lon),a=Math.min(d,360-d);
    if([60,90,120,180].some(x=>Math.abs(a-x)<6)&&act[i].id.length>2&&act[j].id.length>2){
      const [x1,y1]=pt(act[i].lon,120),[x2,y2]=pt(act[j].lon,120);
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--acc)" stroke-opacity=".35"/>`;
    }
  }
  B.forEach((b,i)=>{
    const rr=112-(i%3)*14,[x,y]=pt(b.lon,rr);
    s+=`<g opacity="${b.on?1:.25}"><circle cx="${x}" cy="${y}" r="10" fill="var(--card)" stroke="${b.col}"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${b.g.length>1?9:13}" fill="${b.col}" font-weight="600">${b.g}</text></g>`;
  });
  svg.innerHTML=s;
}
const F=[["Y","Year"],["M","Month"],["D","Day"],["h","Hour"],["m","Min"]];
function getF(d,k){return k=="Y"?d.getFullYear():k=="M"?d.getMonth()+1:k=="D"?d.getDate():k=="h"?d.getHours():d.getMinutes()}
function setF(k,v){const d=new Date(t);
  if(k=="Y")d.setFullYear(v);else if(k=="M")d.setMonth(v-1);else if(k=="D")d.setDate(v);else if(k=="h")d.setHours(v);else d.setMinutes(v);
  if(!isNaN(d))t=d.getTime();render()}
$("dtg").innerHTML=F.map(([k,n])=>`<div><label>${n}</label><input id="f_${k}" type="number" inputmode="numeric"><div class="b"><button data-k="${k}" data-d="-1">−</button><button data-k="${k}" data-d="1">+</button></div></div>`).join("");
$("dtg").onclick=e=>{const k=e.target.dataset.k;if(k)setF(k,getF(new Date(t),k)+parseInt(e.target.dataset.d))};
F.forEach(([k])=>$("f_"+k).onchange=e=>setF(k,parseInt(e.target.value)));
function render(){
  const L=lons(new Date(t));
  B.forEach(b=>{const n=L[b.id];if(Math.abs(n-b.lon)>180)b.jump=true;b.lon=n});
  audioUpdate();
  B.forEach(b=>{const d=Math.floor(b.lon%30),m=Math.floor((b.lon%1)*60);
    $("n_"+b.id).innerHTML=`${d}° ${SIGNS[Math.floor(b.lon/30)]} ${String(m).padStart(2,"0")}'<small>${noteName(freq(b))}</small>`});
  const d=new Date(t);F.forEach(([k])=>{if(document.activeElement!==$("f_"+k))$("f_"+k).value=getF(d,k)});
  draw();
}
function silentWav(){const n=8000,h=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>[...s].forEach((c,i)=>h.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");h.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);
  h.setUint32(24,8000,true);h.setUint32(28,16000,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,"data");h.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([h.buffer],{type:"audio/wav"}))}
$("snd").onclick=async()=>{
  soundOn=!soundOn;
  if(soundOn){
    try{navigator.audioSession&&(navigator.audioSession.type="playback")}catch(e){}
    if(!keep){keep=new Audio(silentWav());keep.loop=true;keep.setAttribute("playsinline","")}
    try{await keep.play()}catch(e){}   // lets iOS play audio even with the silent switch on
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;
      const c=ctx.createDynamicsCompressor();master.connect(c);c.connect(ctx.destination);}
    await ctx.resume();
    const o=ctx.createOscillator();o.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.01);
    audioUpdate();
    master.gain.setTargetAtTime(1,ctx.currentTime,0.05);
  }else if(ctx){master.gain.setTargetAtTime(0,ctx.currentTime,0.05);keep&&keep.pause()}
  $("snd").textContent=soundOn?"🔊 Sound on":"🔇 Sound off";$("snd").classList.toggle("on",soundOn);
  $("st").textContent=ctx?"audio: "+ctx.state:"";
};
$("now").onclick=()=>{t=Date.now();render()};
$("lat").onchange=$("lon").onchange=render;
function map(){$("map").innerHTML=SIGNS.map((g,i)=>`<span>${g} ${NAMES[(i*order)%12]}</span>`).join("")}
$("ord").onchange=e=>{order=parseInt(e.target.value);map();render()};
$("mic").onchange=e=>{micro=parseInt(e.target.value);render()};
$("optb").onclick=()=>{$("opt").hidden=!$("opt").hidden};
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"⏸ Pause":"▶ Play";$("play").classList.toggle("on",playing)};
$("rev").onclick=()=>{dir*=-1;$("rev").textContent=dir>0?"⇄ Forward":"⇄ Backward"};
let last=performance.now(),lr=0;
function loop(n){const dt=(n-last)/1000;last=n;
  if(playing){t+=dt*dir*parseFloat($("spd").value)*1000;if(n-lr>80){lr=n;render()}}
  requestAnimationFrame(loop)}
function applySpeed(){const fast=parseFloat($("spd").value)>=86400;
  ["Asc","MC"].forEach(id=>{const b=B.find(x=>x.id==id);b.on=fast?false:b.pref;$("c_"+id).checked=b.on});render()}
$("spd").onchange=applySpeed;
map();requestAnimationFrame(loop);
render();
</script>
</body></html>
